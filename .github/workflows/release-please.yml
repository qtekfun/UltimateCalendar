# On every push to master, release-please keeps a release PR up to date (next version from the
# Conventional Commits, CHANGELOG.md and appVersion in gradle.properties). Merging that PR tags
# vX.Y.Z and creates the GitHub Release; then this workflow builds the signed APK and attaches it.
# See RELEASING.md.
name: Release

on:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
      version: ${{ steps.rp.outputs.version }}
    steps:
      # RELEASE_PLEASE_TOKEN (fine-grained PAT or GitHub App token with contents and pull-requests
      # write) instead of GITHUB_TOKEN, so the release PR triggers CI and can satisfy the ruleset.
      - id: rp
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  apk:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Check that the tag matches appVersion
        env:
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          version=$(grep '^appVersion=' gradle.properties | cut -d= -f2)
          test "v$version" = "$TAG" || { echo "Tag $TAG does not match appVersion $version"; exit 1; }

      - name: Check and build the release APK
        env:
          UC_KEYSTORE_BASE64: ${{ secrets.UC_KEYSTORE_BASE64 }}
          UC_KEYSTORE_PASSWORD: ${{ secrets.UC_KEYSTORE_PASSWORD }}
          UC_KEY_ALIAS: ${{ secrets.UC_KEY_ALIAS }}
          UC_KEY_PASSWORD: ${{ secrets.UC_KEY_PASSWORD }}
        run: |
          test -n "$UC_KEYSTORE_BASE64" || { echo "Missing signing secrets"; exit 1; }
          export UC_KEYSTORE_FILE="$RUNNER_TEMP/release.jks"
          echo "$UC_KEYSTORE_BASE64" | base64 -d > "$UC_KEYSTORE_FILE"
          ./gradlew check assembleRelease
          rm -f "$UC_KEYSTORE_FILE"

      - name: Attach the APK to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
          VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          apk="UltimateCalendar-$VERSION.apk"
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          sha256sum "$apk" > "$apk.sha256"
          gh release upload "$TAG" "$apk" "$apk.sha256" --repo "$GITHUB_REPOSITORY"
          case "$VERSION" in *-rc.*) gh release edit "$TAG" --prerelease --repo "$GITHUB_REPOSITORY" ;; esac
