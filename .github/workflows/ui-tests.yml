# Instrumented tests (provider contract suite against the real CalendarProvider, key UI flows)
# on an emulator. Too slow for every PR: runs nightly, on demand, and on PRs labelled ui-tests.
name: UI tests

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
    inputs:
      screenshots:
        description: Run only the Screenshots test and upload the PNGs, instead of the UI tests
        type: boolean
        default: false
      device:
        description: Screenshots on a phone or a tablet emulator
        type: choice
        options: [phone, tablet]
        default: phone
      perf:
        description: "Run the provider timing test (T25, seeds 20,000 events) instead of the UI tests"
        type: boolean
        default: false
  pull_request:
    types: [labeled, synchronize]

permissions:
  contents: read

concurrency:
  group: ui-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  emulator:
    if: >-
      (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ui-tests'))
      && !(github.event_name == 'workflow_dispatch' && inputs.screenshots)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        api-level: [26, 36]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: >-
            ./gradlew connectedDebugAndroidTest
            ${{ inputs.perf && '-Pandroid.testInstrumentationRunnerArguments.perf=true -Pandroid.testInstrumentationRunnerArguments.class=com.qtekfun.ultimatecalendar.data.source.ProviderPerformanceTest' || '' }}

      - name: Print the timings
        if: always() && inputs.perf
        run: grep -rhE "T25 " app/build/outputs/androidTest-results/ | sort -u || true

      - name: Upload timings
        if: always() && inputs.perf
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: perf-timings-${{ matrix.api-level }}
          path: app/build/outputs/androidTest-results/
          retention-days: 30

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ui-test-reports-${{ matrix.api-level }}
          path: app/build/reports/androidTests/
          retention-days: 14

  # On demand only (workflow_dispatch with screenshots): the store and README images, drawn from
  # invented data on an emulator. Download the artifact and commit the PNGs under fastlane/.
  screenshots:
    if: github.event_name == 'workflow_dispatch' && inputs.screenshots
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: ${{ inputs.device == 'tablet' && 'pixel_tablet' || 'pixel_6' }}
          disable-animations: true
          script: tools/take-screenshots.sh ${{ inputs.device }} build/screenshots

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: screenshots-${{ inputs.device }}
          path: build/screenshots/
          if-no-files-found: warn
          retention-days: 14
