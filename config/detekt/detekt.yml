#
# Overrides on top of detekt's default configuration (buildUponDefaultConfig).
# Keep this list short and justify every entry.

build:
  maxIssues: 0

config:
  validation: true
  warningsAsErrors: true

naming:
  FunctionNaming:
    # Composables are PascalCase by Compose API guidelines.
    ignoreAnnotated:
      - Composable

complexity:
  TooManyFunctions:
    # detekt's default test exclusions (an excludes list replaces them; sharedTest is the
    # fake and contract suite shared by test and androidTest), plus the Room
    # database, which exposes one accessor per DAO.
    excludes:
      - '**/test/**'
      - '**/androidTest/**'
      - '**/sharedTest/**'
      - '**/data/local/UltimateCalendarDatabase.kt'
  LongParameterList:
    # Composables expose many optional parameters with defaults.
    ignoreDefaultParameters: true

style:
  UnusedPrivateMember:
    # Private @Preview functions are only referenced by the IDE.
    ignoreAnnotated:
      - Preview
  MagicNumber:
    # detekt's default test exclusions, plus color and typography tokens,
    # which are literal values by nature.
    excludes:
      - '**/test/**'
      - '**/androidTest/**'
      - '**/sharedTest/**'
      - '**/*.kts'
      - '**/ui/theme/**'
      # Sample data of the drag and drop prototype (T02).
      - '**/ui/prototype/board/FakeBoard.kt'
      # Invented demo calendars and events (debug builds only).
      - '**/ui/demo/**'
      # Invented sample data of the grid previews (T15).
      - '**/ui/timegrid/TimeGridPreviews.kt'
      # Invented sample data of the month previews (T17).
      - '**/ui/month/MonthPreviews.kt'
      # Invented sample data of the Week previews (T16).
      - '**/ui/timegrid/WeekPreviews.kt'
